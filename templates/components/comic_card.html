{% comment %}Card de cómic — spec §4.3.

  Fondo claro y título con aire de "logo de cómic".
  Parámetros: c (Comic).
{% endcomment %}
<article class="devil-card w-[300px] p-4">
  <a href="{% url 'comics:detail' c.slug %}" class="block no-underline">
    <img
      src="{{ c.cover_image.url }}"
      alt="Portada de {{ c.title }}"
      class="w-full rounded-2xl bg-white"
      loading="lazy"
      width="300" height="300">
    <h3 class="mt-3 text-3xl font-black uppercase leading-none tracking-wide text-devil-ink">
      {{ c.title }}
    </h3>
  </a>
  <p class="mt-2 text-lg opacity-70">{{ c.tagline }}</p>
</article>
