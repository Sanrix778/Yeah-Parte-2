{% load static %}<!DOCTYPE html>
<html lang="es" class="bg-devil-bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Devilopers{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Portal de los Devilopers: juegos, personajes y comics.{% endblock %}">
  {% include "partials/head_meta.html" %}
  <link rel="stylesheet" href="{% static 'css/dist/output.css' %}">
</head>
<body class="min-h-screen bg-devil-bg text-devil-ink">

  {% include "partials/header.html" %}

  <main class="mx-auto w-full max-w-[1200px] px-4 py-8 md:px-8">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script type="module" src="{% static 'js/main.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
