[project]
name = "devilweb"
version = "0.1.0"
description = "Portal Devilopers — catálogo de juegos, personajes y comics"
requires-python = ">=3.9"
dependencies = [
    # El entorno tiene Python 3.9, que no soporta Django 5.2 (requiere >=3.10).
    # Cuando se suba a 3.13, cambiar a "Django>=5.2,<5.3".
    "Django>=4.2,<5.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
    "django-axes>=6.0",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]